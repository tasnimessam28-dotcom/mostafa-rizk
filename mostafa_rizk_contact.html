<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" href="https://www.fontstatic.com/f=diwanltr">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مصطفى رزق</title>
  <meta name="description" content="بيانات التواصل مع مصطفى رزق">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Tahoma", "Arial", sans-serif;
      background:
      radial-gradient(circle at 15% 15%, rgba(255,255,255,.9) 0, rgba(255,255,255,0) 32%),
      radial-gradient(circle at 85% 85%, rgba(220,210,194,.45) 0, rgba(220,210,194,0) 38%),
      linear-gradient(145deg, #f5f1eb, #e8e1d8);
      color: #17212b;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 14px;
    }
    .card {
      width: min(430px, 100%);
      background: rgba(255,255,255,.96);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 18px 55px rgba(20,35,45,.18);
      text-align: center;
    }
    .top {
      height: 105px;
      background: linear-gradient(135deg, #18242d, #425663);
      position: relative;
    }
    .photo {
      width: 145px;
      height: 145px;
      object-fit: cover;
      border-radius: 50%;
      border: 6px solid #fff;
      position: absolute;
      left: 50%;
      bottom: -72px;
      transform: translateX(-50%);
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
    }
    .content {
      padding: 86px 25px 28px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 42px;
      font-family: "diwanltr", "Diwani Letter", serif;
      font-weight: 400;
    }
    .subtitle {
      color: #6c7880;
      font-size: 14px;
      margin-bottom: 26px;
    }
    .phone {
      display: flex;
      align-items: center;
      gap: 12px;
      direction: rtl;
      text-decoration: none;
      color: #17212b;
      background: #f4f7f8;
      border: 1px solid #e3e9ec;
      padding: 14px 16px;
      border-radius: 15px;
      margin: 10px 0;
      font-size: 17px;
      font-weight: 600;
      transition: .2s;
    }
    .phone:hover { transform: translateY(-2px); }
    .phone .icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #dfe8ed;
      display: grid;
      place-items: center;
      font-size: 20px;
      flex: 0 0 40px;
    }
    .links {
      margin-top: 22px;
      display: grid;
      gap: 12px;
    }
    .social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 54px;
      border-radius: 15px;
      text-decoration: none;
      color: white;
      font-size: 17px;
      font-weight: 700;
      transition: transform .2s, opacity .2s;
    }
    .social:hover { transform: translateY(-2px); opacity: .92; }
    .instagram { background: linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045); }
    .facebook { background: #1877f2; }
    .footer {
      margin-top: 22px;
      color: #9aa4aa;
      font-size: 12px;
    }
  </style>
</head>
